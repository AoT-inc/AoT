# /etc/nginx/conf.d/aotflask_static_cache.conf
#
# 정적 자산의 캐시 수명을 **버전 쿼리(?v=) 유무로** 가른다.
#
# 왜 필요한가: 네이티브 설치에서 nginx 는 /static/ 을 디스크에서 직접 서빙한다
# (aotflask_nginx.conf 참조 — Flask 를 거치면 요청당 ~110ms 와 자산마다 Set-Cookie 가
# 붙는다). 그래서 Flask 의 캐시 정책(app.py `_static_cache_policy`)이 **아예 실행되지
# 않는다.** nginx 쪽에도 같은 규칙이 필요하다.
#
# 무엇을 막는가: 버전 없는 URL 은 내용이 바뀌어도 URL 이 그대로다. 거기에 1년 캐시를
# 주면 곧 "1년간 옛 코드 실행" 이 된다 — 2026-08-13 지도 삭제 사고가 그것이다
# (`geo_design.html` 이 `aot-map-data.js` 를 버전 없이 불렀고, 그 파일이 바뀐 뒤에도
# 브라우저가 서버에 묻지 않았다). 버전이 붙은 URL 은 내용이 바뀌면 URL 이 바뀌므로
# 1년 + immutable 이 맞다.
#
# `if` 를 쓰지 않는다 — location 안의 `if` 는 add_header 와 함께 쓸 때 동작이
# 예측하기 어렵다(nginx 의 알려진 함정). map 은 http 컨텍스트에서 안전하게 평가된다.
#
# 설치: aot/scripts/upgrade_commands.sh 의 web-server-enable 이 conf.d 로 복사한다.

map $args $aot_static_cache_control {
    default     "public, max-age=300, must-revalidate";
    "~(^|&)v="  "public, max-age=31536000, immutable";
}
