server {
    listen 80;
    listen 443 ssl;

    client_max_body_size 30M;

    ssl_certificate     /opt/AoT/aot/aot_flask/ssl_certs/server.crt;
    ssl_certificate_key /opt/AoT/aot/aot_flask/ssl_certs/server.key;

    # Serve static assets directly from nginx — never proxy them to the single
    # gunicorn worker. Routing /static through the WSGI app added ~110ms/request
    # of fixed overhead and made Flask-Session write a session file (+Set-Cookie)
    # for every asset. nginx serves them in ~17ms with no session churn.
    # NOTE: the nginx worker user (www-data) must be able to traverse /opt/AoT
    # (it is mode 0770 aot:aot) — add www-data to the 'aot' group:
    #   sudo usermod -aG aot www-data && sudo systemctl restart nginx
    # 캐시 수명은 **버전 쿼리(?v=) 유무로** 가른다. 예전에는 무조건 1y+immutable
    # 이었는데, 버전 없는 URL 은 내용이 바뀌어도 URL 이 그대로라 그것이 곧 "1년간
    # 옛 코드 실행" 이 됐다(2026-08-13 지도 삭제 사고). $aot_static_cache_control 은
    # conf.d/aotflask_static_cache.conf 의 map 이 정한다 — 그 파일이 없으면 변수가
    # 빈 값이라 헤더가 안 나가므로, web-server-enable 이 둘을 함께 설치한다.
    location /static/ {
        alias /opt/AoT/aot/aot_flask/static/;
        expires off;
        add_header Cache-Control $aot_static_cache_control always;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/usr/local/aotflask.sock;
        client_max_body_size 200M;
        proxy_read_timeout 360;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    error_page 502 /502.html;
    location = /502.html {
      root  /opt/AoT/aot/aot_flask/templates;
    }
}
