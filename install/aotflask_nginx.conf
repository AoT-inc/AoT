server {
    listen 80;
    # HTTP/2 — 대시보드는 한 번 열 때 자기 출처로만 20개 넘는 요청을 보내는데,
    # HTTP/1.1 은 출처당 연결이 6개라 나머지가 브라우저 안에서 순서를 기다린다.
    # 라즈베리파이 실측에서 `/api/geo/plots` 4,280ms 중 **2,786ms 가 그 대기**로,
    # 서버가 아니라 프로토콜이 만든 시간이었다.
    #
    # **`http2 on;` 을 쓰지 말 것.** 그 지시자는 nginx 1.25.1 에서 생겼다 —
    # Debian 11(1.18)·12(1.22)에 그대로 나가면 "unknown directive" 로 **nginx 가
    # 통째로 기동에 실패한다.** 아래 listen 파라미터 형식은 1.9.5 부터 1.26 까지
    # 전부 동작한다(1.25.1+ 에서 deprecated 경고 한 줄이 뜨지만 기능은 같다).
    # 설치 기반의 nginx 버전을 알 수 없으므로 경고보다 호환을 택한다.
    listen 443 ssl http2;

    client_max_body_size 30M;

    ssl_certificate     /opt/AoT/aot/aot_flask/ssl_certs/server.crt;
    ssl_certificate_key /opt/AoT/aot/aot_flask/ssl_certs/server.key;

    # Serve static assets directly from nginx — never proxy them to the single
    # gunicorn worker. Routing /static through the WSGI app added ~110ms/request
    # of fixed overhead and made Flask-Session write a session file (+Set-Cookie)
    # for every asset. nginx serves them in ~17ms with no session churn.
    # NOTE: the nginx worker user (www-data) must be able to traverse /opt/AoT
    # (it is mode 0770 aot:aot) — add www-data to the 'aot' group:
    #   sudo usermod -aG aot www-data && sudo systemctl restart nginx
    # 캐시 수명은 **버전 쿼리(?v=) 유무로** 가른다. 예전에는 무조건 1y+immutable
    # 이었는데, 버전 없는 URL 은 내용이 바뀌어도 URL 이 그대로라 그것이 곧 "1년간
    # 옛 코드 실행" 이 됐다(2026-08-13 지도 삭제 사고). $aot_static_cache_control 은
    # conf.d/aotflask_static_cache.conf 의 map 이 정한다 — 그 파일이 없으면 변수가
    # 빈 값이라 헤더가 안 나가므로, web-server-enable 이 둘을 함께 설치한다.
    location /static/ {
        alias /opt/AoT/aot/aot_flask/static/;
        expires off;
        add_header Cache-Control $aot_static_cache_control always;
        access_log off;
    }

    # MCP 서버(포트 5700) — 외부 AI 앱(claude.ai 등)이 붙는 경로. 설정 > MCP 인증에서
    # 켜기 전에는 5700 에 아무것도 없어 이 두 경로만 502 로 답한다(나머지는 영향 없음).
    # 공개 주소를 프록시·터널 뒤에 둘 때도 이 두 경로를 그대로 전달해야 한다.
    # (docs/ai/overview#embedded-auth)
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:5700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:5700;
        proxy_set_header Host $host;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/usr/local/aotflask.sock;
        client_max_body_size 200M;
        proxy_read_timeout 360;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    error_page 502 /502.html;
    location = /502.html {
      root  /opt/AoT/aot/aot_flask/templates;
    }
}
