# systemd drop-in — 네이티브 AoT 서비스가 Matter 서버에 붙는 주소.
# docker/docker-compose.matter-native.yml 로 띄운 서버(호스트 루프백 5580)를 가리킨다.
# aot·aotflask·aotmcp 세 서비스에 같은 파일을 둔다(docs/Matter.md#native):
#
#   for s in aot aotflask aotmcp; do
#     sudo install -D -m 644 /opt/AoT/install/aot-matter.conf \
#         /etc/systemd/system/$s.service.d/matter.conf
#   done
#   sudo systemctl daemon-reload
#   sudo systemctl restart aot aotflask aotmcp
[Service]
Environment=AOT_MATTER_URL=ws://127.0.0.1:5580/ws
