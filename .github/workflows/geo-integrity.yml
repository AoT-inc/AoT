name: Geo Data Integrity

# 지도 데이터의 구조 불변식을 CI 에서 지킨다.
#
# DB 트리거(p6_22/p6_23)가 '잘못된 데이터'를 런타임에 막는다면, 여기서는
# '규칙을 모르는 코드'를 병합 전에 막는다 — 실패를 왼쪽으로 옮긴다.
# 2026-08-03 오염 사고(도형 이중화 → 시설·zone 연결 단절)의 재발 방지책이며,
# 배경과 불변식 카탈로그는 docs/design/geo-data-integrity.md 가 정본이다.
#
# 두 가지를 본다:
#   1. 소유권 — geo 패키지 밖에서 GeoShape 를 직접 쓰는 코드 (정적 AST 검사)
#   2. 차단력 — 원시 SQL 우회 공격이 실제로 막히는지 (인메모리 DB 공격 테스트)

on:
  push:
    branches:
      - main
    paths:
      - 'aot/**/*.py'
      - 'alembic_db/**/*.py'
      - '.github/workflows/geo-integrity.yml'
  pull_request:
    paths:
      - 'aot/**/*.py'
      - 'alembic_db/**/*.py'
      - '.github/workflows/geo-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 정적 검사는 의존성이 필요 없다(표준 라이브러리 AST). 별도 잡으로 떼어
  # 두면 아래 잡의 설치가 깨져도 이 검사는 계속 돈다 — "설치 실패가 무결성
  # 검사를 가리지 않게" 라는 원래 의도를 주석이 아니라 구조로 보장한다.
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 소유권 검사 (geo 패키지 밖 지도 쓰기 금지)
        run: python3 aot/scripts/check_geo_writes.py

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 전체 requirements(119줄, opencv·numpy·grpcio 핀 고정)를 설치하지 않는다
      # — 느리고, 핀 하나가 깨지면 무결성 검사가 통째로 가려진다.
      #
      # 목록이 이만큼 긴 이유: aot/tests/conftest.py 가 pytest_configure 에서
      # aot.aot_flask.extensions 를 import 하고, 그것이 모델 패키지 전체를
      # 끌어온다. 그래서 테스트 파일이 직접 쓰지 않는 것들(bcrypt·Pyro5·
      # influxdb-client 등)까지 필요하다. **줄이지 말 것** — 도입 당시
      # "Flask/SQLAlchemy 만 있으면 된다"고 가정했다가 이 워크플로가
      # 2026-08-03~08-05 사이 13번 연속 실패했고(단 한 번도 성공한 적 없음),
      # 그동안 불변식 공격 테스트는 한 번도 실행되지 않았다.
      # 모델 쪽에 새 최상위 import 가 생기면 여기도 함께 늘려야 한다.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            flask flask-sqlalchemy flask-babel flask-marshmallow flask-wtf \
            flask-caching flask-login marshmallow-sqlalchemy sqlalchemy alembic \
            shapely bcrypt requests importlib-metadata Pyro5 influxdb-client pytest

      # 우회 공격이 DB 계층에서 막히는지 — 불변식의 실제 차단력.
      - name: 불변식 공격 테스트
        run: python3 -m pytest aot/tests/geo/test_geo_invariants_attack.py -q

      # 게이트웨이 계약 + 소유권 회귀.
      - name: 게이트웨이 계약 테스트
        run: python3 -m pytest aot/tests/geo/test_geo_s5_gateway.py -q
