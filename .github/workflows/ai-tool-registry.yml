name: AI Tool Registry SSOT

# AI 도구 하나는 tool_registry.py 의 Tool(...) 선언 한 줄에서 5곳으로 파생된다:
# tool_map(디스패치) · VIRTUAL_TOOL_REGISTRY(이름 검증) · _VIRTUAL_APPROVAL_TOOLS
# (디스패치 승인) · _APPROVAL_REQUIRED_TOOLS(플래너 승인) · manifest(LLM 노출).
# 이 검사가 그 다섯이 어긋나지 않게 지키는 유일한 가드이고, 핵심 가치는
# **승인 게이트 누락**을 잡는 것이다 — 상태를 바꾸는 도구가 approval 집합에서
# 빠지면 사람 승인 없이 실행되는 쓰기 도구가 생긴다.
#
# 왜 워크플로가 여기 새로 생겼나: CLAUDE.md 는 이 워크플로와
# test_write_tools_are_gated() 가 있다고 적어 왔지만 레포에는 둘 다 없었다
# (2026-08-07 확인). 즉 "지키는 검사가 있다"고 믿었을 뿐 실제로 도는 것은
# 아무것도 없었다.
#
# **잡을 둘로 나눈 이유.** tool_map 검사만이 실제 핸들러를 import 해야 하고,
# 그 사슬이 서드파티 17개(flask/sqlalchemy/shapely/Pyro5/influxdb-client …)를
# 끌어온다. 그 설치가 깨지면 승인 게이팅 검사까지 통째로 가려진다 —
# geo-integrity 가 겪은 실패 방식 그대로다. 그래서 게이팅 쪽(gating)은 의존성
# 없이 먼저 돌리고, 무거운 쪽(dispatch-map)은 별도 잡으로 뗀다. 아래 잡이
# 설치 문제로 죽어도 위 잡은 계속 판정을 낸다.

on:
  push:
    branches:
      - main
    paths:
      - 'aot/ai/**'
      - 'aot/tests/ai_eval/test_tool_registry_ssot.py'
      - '.github/workflows/ai-tool-registry.yml'
  pull_request:
    paths:
      - 'aot/ai/**'
      - 'aot/tests/ai_eval/test_tool_registry_ssot.py'
      - '.github/workflows/ai-tool-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 안전에 직결되는 쪽. 선언만 읽으므로 설치가 없다 — 그래서 무엇도 이 판정을
  # 가릴 수 없다. 승인 집합·config_only 면제·쓰기형 이름 게이팅이 여기 있다.
  gating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check approval sets and write-name gating (no dependencies)
        run: python3 -m aot.tests.ai_eval.test_tool_registry_ssot --no-dispatch

  # 선언된 도구가 실제로 디스패치되는지. 핸들러 import 사슬이 필요하다.
  # 목록을 줄이지 말 것 — 하나라도 빠지면 ModuleNotFoundError 로 죽는다
  # (2026-08-07 실측으로 뽑은 최소 집합이다). 모델에 새 최상위 import 가
  # 생기면 여기도 함께 늘려야 한다.
  dispatch-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install handler import chain
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            pytz python-dateutil requests \
            sqlalchemy flask flask-sqlalchemy flask-marshmallow marshmallow-sqlalchemy \
            flask-wtf flask-caching flask-babel flask-login bcrypt \
            influxdb-client Pyro5 importlib-metadata shapely

      - name: Check tool_map dispatch resolution
        run: python3 -m aot.tests.ai_eval.test_tool_registry_ssot
