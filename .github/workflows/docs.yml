name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

# 동시 배포 방지: gh-deploy --force 중첩 실행이 gh-pages를 손상시킬 수 있음
concurrency:
  group: docs-deploy
  cancel-in-progress: false

# 공개 저장소(AoT-inc/AoT)에서만 배포한다. 비공개 작업 저장소(AoT-inc/AoT-dev)도
# Actions 가 켜져 있어, 가드가 없으면 main push 마다 미공개 문서를 그 저장소의
# gh-pages 에 올린다 — 지금은 Pages 가 꺼져 있어 밖으로 나가지 않지만, 켜는 순간
# 그대로 서비스된다. docker-publish.yml 과 같은 가드다. 포크도 건너뛴다.
jobs:
  deploy:
    if: github.repository == 'AoT-inc/AoT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Deploy
        run: mkdocs gh-deploy --force
