name: Publish Docker image

# Builds a multi-arch (amd64 + arm64) image and pushes it to GHCR.
# Triggers on a release tag (v*.*.*) or manual dispatch.
# The image tag is derived from AOT_VERSION in aot/config/__init__.py so the
# zero-padded scheme (e.g. 26.07.3 / 26.07) is preserved (semver would drop the 0).
#
# Prerequisites (one-time):
#   - Repo hosted on GitHub (this workflow does NOT run on Gitea).
#   - After the first publish, set the GHCR package visibility to Public
#     (repo → Packages → aot → Package settings), or configure org policy.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from config
        id: ver
        run: |
          V=$(grep -m1 "AOT_VERSION = " aot/config/__init__.py | sed -E "s/.*'([0-9.]+)'.*/\1/")
          MM=$(echo "$V" | cut -d. -f1-2)
          if [ -z "$V" ]; then echo "Could not read AOT_VERSION"; exit 1; fi
          echo "version=$V"     >> "$GITHUB_OUTPUT"
          echo "majorminor=$MM" >> "$GITHUB_OUTPUT"
          echo "Derived version=$V majorminor=$MM"

      - uses: docker/setup-qemu-action@v3      # arm64 emulation for multi-arch build
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aot
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.majorminor }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
