{% extends 'layout.html' %}
{% block title %}{{ _('Location Selection') }}{% endblock %}

{% block body %}
<!-- MapLibre GL 은 layout.html head 에서 제공됨 (GIS 설정의 로컬/CDN 옵션 적용).
     여기서 재로드하면 window.maplibregl 을 덮어쓰므로 로드하지 않는다. -->

<div class="container-fluid p-0">
    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center p-3 bg-white border-bottom shadow-sm">
        <div class="d-flex align-items-center gap-3">
            <h5 class="mb-0 mr-3">{{ _('Location Picker') }}</h5>
            <div class="text-muted small">
                {{ _('Click on the map to select a location.') }}
            </div>
        </div>
        <div>
            <button class="btn aot-pill-btn aot-pill-btn-primary aot-pill-btn-sm" id="btn-confirm-location" disabled>
                <i class="fas fa-check"></i> {{ _('Confirm Selection') }}
            </button>
        </div>
    </div>

    <!-- Map Canvas -->
    <div class="position-relative loc-map-stage">
        <div id="location-map" class="loc-map-canvas"></div>

        <!-- Coordinates Display -->
        <div class="position-absolute loc-coord-readout">
            <span id="selected-coords" class="font-weight-bold font-monospace">{{ _('No location selected') }}</span>
        </div>
    </div>
</div>

<!-- JS Logic -->
<script src="{{ asset('page-location-entry') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize Location Picker (Pure MapLibre)
        // Accepts query params like ?lat=...&lng=... for initial position
        const urlParams = new URLSearchParams(window.location.search);
        const initialLat = parseFloat(urlParams.get('lat'));
        const initialLng = parseFloat(urlParams.get('lng'));

        window.locationPicker = new AoTLocationPicker('location-map', {
            lat: initialLat,
            lng: initialLng
        });
        window.locationPicker.init();
    });
</script>
{% endblock %}
