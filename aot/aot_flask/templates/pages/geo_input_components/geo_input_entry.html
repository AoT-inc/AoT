<form id="form_input_{{each_input.unique_id}}" method="post" action="/input">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="input_id" value="{{ each_input.unique_id }}">

    <div id="input_status_{{each_input.unique_id}}" data-config-uid="{{each_input.unique_id}}"
        class="grid-stack-item-content {% if each_input.is_activated -%}active-background{% else -%}inactive-background{% endif %} row small-gutters aot-entry-item">
        <div class="aot-entry-drag-handle">
            <i class="fa fa-grip-lines"></i>
        </div>

        <div class="aot-entry-content-item aot-col-name">
            <div id="input_name_{{each_input.unique_id}}" class="form-control aot-entry-name-input" title="{{each_input.name}}">{{each_input.name}}</div>
        </div>
        <div class="aot-entry-content-item aot-col-uuid">
            <input class="form-control btn aot-entry-uuid-btn aot-pill-btn" type="button"
                onclick="setClipboard('{{each_input.unique_id}}')"
                title="UUID: {{each_input.unique_id}}, {{dict_translation['copy_to_clipboard']['phrase']}}"
                value="{{ dict_inputs.get(each_input.type, {}).get('input_name', each_input.type) }}">
        </div>
        <div class="aot-entry-actions aot-col-action">
            <input {% if each_input.is_activated -%}style="display: none" {% endif %}
                onclick="return $(this).processRequest(this, 'input_activate');" name="input_activate"
                id="input_activate_{{each_input.unique_id}}" class="form-control btn aot-pill-btn aot-pill-btn-primary" type="button"
                value="{{_('Activate')}}" />
            <input {% if not each_input.is_activated -%}style="display: none" {% endif %}
                onclick="return $(this).processRequest(this, 'input_deactivate');" name="input_deactivate"
                id="input_deactivate_{{each_input.unique_id}}" class="form-control btn aot-pill-btn aot-pill-btn-primary" type="button"
                value="{{_('Deactivate')}}" />
        </div>
        <div class="aot-entry-settings">
            <a class="btn p-0" data-toggle="modal" data-target="#modal_config_{{each_input.unique_id}}">
                <i class="fas fa-cog"></i>
            </a>
        </div>
    </div>
</form>

<!-- Modal Config -->
<div class="modal fade aot-option-modal aot-widget-drawer aot-drawer-fullcover" data-backdrop="false" id="modal_config_{{each_input.unique_id}}" tabindex="-1" role="dialog"
    aria-labelledby="ModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl aot-modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ _('Input Settings') }}{% if each_input.type in dict_inputs %}:
                    {{ dict_inputs.get(each_input.type, {}).get('input_name', each_input.type) }}{% endif %}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                {% include 'pages/geo_input_components/geo_input_option.html' %}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn aot-pill-btn aot-pill-btn-primary" data-dismiss="modal">{{ _('Close') }}</button>
                <button data-form-id="form_config_{{each_input.unique_id}}" type="button" class="btn aot-pill-btn aot-pill-btn-primary"
                    onclick="return confirm('{{_('Are you sure you want to delete?')}}') && $(this).processRequest(this, 'input_delete')">{{ _('Delete') }}</button>
                <button data-form-id="form_config_{{each_input.unique_id}}" type="button" class="btn aot-pill-btn aot-pill-btn-primary"
                    onclick="$(this).processRequest(this, 'input_mod')">{{ _('Save') }}</button>
                <button type="button" class="btn aot-pill-btn aot-pill-btn-primary"
                    onclick="AIContextPanel.openContext('{{ each_input.unique_id }}', '{{ each_input.name }}')">{{ _('AI Context') }}</button>
            </div>
        </div>
    </div>
</div>
