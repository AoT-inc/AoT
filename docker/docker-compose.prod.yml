# Production / distribution compose — runs the pre-built GHCR image instead of
# building from a host source checkout. Upgrade with:
#     docker compose -f docker/docker-compose.prod.yml pull
#     docker compose -f docker/docker-compose.prod.yml up -d
# The app auto-migrates the volume DB on startup (aot_flask/app.py). All data
# (SQLite DBs, secret key, kma, InfluxDB, uploaded files, 3D model assets,
# admin/backup snapshots, user scripts) lives in named volumes and survives
# image swaps. Roll back by pinning AOT_IMAGE_TAG to a previous version.
#
# Copy .env.prod.example to .env and set AOT_IMAGE_TAG.
name: aot

services:
  aot-app:
    image: ${AOT_IMAGE_REPO:-ghcr.io/aot-inc/aot}:${AOT_IMAGE_TAG:-latest}
    command: gunicorn -c /app/install/gunicorn_conf.py --bind 0.0.0.0:80 aot.start_flask_ui:app
    ports:
      - "${AOT_PORT:-8084}:80"
      # MCP 포트는 전용 aot_mcp 서비스가 소유한다 (아래) — 임시 exec 프로세스가
      # 계속 죽는 문제 때문에 별도 서비스로 분리했다.
    volumes:
      # Live data (SQLite DBs + secret key + kma) — named volume, NOT a bind mount
      # (bind mounts break SQLite WAL/atomic-rename on macOS/Windows Docker).
      - aot_data:/app/aot_local
      - flask_session:/app/aot/databases/flask_session
      - aot_logs:/var/log/aot
      # User-uploaded files (notes/notice attachments, facility & zone photos) —
      # without this they live only in the container's writable layer and are
      # lost on every `docker compose pull && up -d` image swap.
      - aot_uploads:/app/uploads
      # Facility 3D model assets (.glb/.gltf + preview thumbnails) — same risk,
      # separate mount because it lives under the Flask static folder, not /app/uploads.
      - aot_model_assets:/app/aot/aot_flask/static/uploads/model_assets
      # admin/backup snapshots (see aot/utils/docker_backup.py) — must persist
      # independently of aot_data, since a backup exists precisely so it can
      # outlive a bad restore or a corrupted live DB.
      - aot_backups:/app/aot/tests/backups
      # User-authored scripts (Export/Import + admin/backup both cover this
      # dir, but with no volume it's still wiped on every image swap).
      - aot_user_scripts:/app/aot/user_scripts
      # User/commercial extension modules are NOT baked into the public image.
      # Mount them from the host (repo custom_* dirs); empty for stock installs.
      - ../aot/inputs/custom_inputs:/app/aot/inputs/custom_inputs
      - ../aot/outputs/custom_outputs:/app/aot/outputs/custom_outputs
      - ../aot/functions/custom_functions:/app/aot/functions/custom_functions
      - ../aot/actions/custom_actions:/app/aot/actions/custom_actions
      - ../aot/widgets/custom_widgets:/app/aot/widgets/custom_widgets
      - ../aot/user_python_code:/app/aot/user_python_code
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      # Display only — Admin → Upgrade shows which tag the host asked for.
      # The authoritative running version is the AOT_VERSION baked into the
      # image; a moving tag such as 'latest' does not identify a build.
      - AOT_IMAGE_TAG=${AOT_IMAGE_TAG:-latest}
      # Lets the updater sidecar read version + schema revision from /health
      # (anonymous callers only get liveness). Declared HERE, not in the
      # updater overlay, because the updater recreates this service with the
      # base file alone — an overlay-only value would vanish at exactly the
      # moment the health gate needs it. Empty unless the overlay is in use.
      - AOT_HEALTH_KEY=${AOT_HEALTH_KEY:-}
      - HARDWARE_PROFILE=${HARDWARE_PROFILE:-LOW}
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  aot_daemon:
    image: ${AOT_IMAGE_REPO:-ghcr.io/aot-inc/aot}:${AOT_IMAGE_TAG:-latest}
    command: python aot/aot_daemon.py
    # SIGTERM 후 Shutdown State 전송 + 감사 flush 가 끝날 시간을 준다.
    # 기본 10초면 절차가 SIGKILL 로 잘린다 (docker-compose.yml 주석 참고).
    stop_grace_period: 180s
    volumes:
      # Same named volume as aot-app: daemon and UI must open the SAME aot.db.
      - aot_data:/app/aot_local
      - aot_logs:/var/log/aot
      # User/commercial extension modules (see aot-app) — the daemon runs outputs.
      - ../aot/inputs/custom_inputs:/app/aot/inputs/custom_inputs
      - ../aot/outputs/custom_outputs:/app/aot/outputs/custom_outputs
      - ../aot/functions/custom_functions:/app/aot/functions/custom_functions
      - ../aot/actions/custom_actions:/app/aot/actions/custom_actions
      - ../aot/widgets/custom_widgets:/app/aot/widgets/custom_widgets
      - ../aot/user_python_code:/app/aot/user_python_code
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=${HARDWARE_PROFILE:-LOW}
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb
    restart: always

  # 외부 MCP 서버 — 외부 AI(Claude Desktop/Code 등)가 상태 점검·제어 조언을 위해
  # 접속한다. HTTP는 이 서비스가 직접 서빙(포트 5700). stdio로 붙는 클라이언트는
  # 반드시 이 컨테이너에 `docker exec -i aot-aot_mcp-1 python aot/aot_mcp_server.py`
  # 로 들어와야 한다 — AOT_MCP_API_KEY(아래)가 이 컨테이너에만 있고 aot-app에는
  # 없다. `aot-app 안에서 docker exec -d`로 임시 프로세스를 띄우는 옛 방식은
  # 재시작/재빌드 때마다 죽고 키도 없어 인증이 깨지므로 쓰지 않는다.
  # aot-app 과 같은 aot_data 볼륨을 마운트해야 같은 aot.db 를 열고 승인 큐
  # (mcp_confirmation)를 공유한다. 인증(mcp_auth.py, X-API-KEY)이 있지만 그와
  # 별개로 LAN/인터넷 노출을 막기 위해 127.0.0.1 로만 바인딩한다.
  aot_mcp:
    image: ${AOT_IMAGE_REPO:-ghcr.io/aot-inc/aot}:${AOT_IMAGE_TAG:-latest}
    command: python aot/aot_mcp_server.py --http --port 5700 --log INFO
    ports:
      - "127.0.0.1:5700:5700"
    volumes:
      # aot-app/aot_daemon 과 동일하게 이미지 코드만 실행한다 — 예전엔 여기만
      # `../:/app`(호스트 소스)를 바인드해서 이미지의 /app 을 통째로 덮어썼는데,
      # 그러면 (a) 레포를 체크아웃 안 한 배포판 사용자에게는 엉뚱한 내용으로
      # 덮이고 (b) 체크아웃이 있어도 aot-app 은 이미지 코드, aot_mcp 는 호스트
      # 코드를 실행해 같은 DB를 서로 다른 버전이 동시에 건드리게 된다. 코드
      # 갱신은 다른 두 서비스처럼 이미지 재발행·pull로 통일한다.
      - aot_data:/app/aot_local
      - aot_logs:/var/log/aot
      - aot_uploads:/app/uploads
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      # 스케줄러를 띄우지 않는다 — aot-app/daemon 과 잡 저장소가 충돌한다.
      - AOT_SKIP_SCHEDULER=1
      # 쓰기 허용이지만 모든 쓰기는 사람 승인을 거친다. 0 이면 조언 전용.
      - AOT_MCP_WRITE_ENABLED=${AOT_MCP_WRITE_ENABLED:-1}
      # 인바운드 인증: X-API-KEY = base64(User.api_key). 키는 설정>사용자에서 발급.
      # 0 으로 끄면 무인증이 되고 호출자 신원이 자기 신고로 돌아간다(감사 로그에
      # 'unauthenticated:' 접두사로 구분된다).
      - AOT_MCP_REQUIRE_AUTH=${AOT_MCP_REQUIRE_AUTH:-1}
      # stdio 로 붙는 MCP 클라이언트용 키. 컨테이너 환경변수로 두면
      # `docker exec -i` 로 뜬 stdio 프로세스가 이를 물려받으므로, 클라이언트
      # 설정 파일에 비밀을 적을 필요가 없다. 값은 gitignore 된 docker/.env 에서 온다.
      - AOT_MCP_API_KEY=${AOT_MCP_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aot-app
    restart: always

  influxdb:
    image: influxdb:2.7
    ports:
      # localhost-only: default credentials are public, so never expose to the LAN.
      # The app containers reach it over the compose network (influxdb:8086).
      - "127.0.0.1:8087:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - TZ=${TZ:-Asia/Seoul}
      # First-boot self-initialization (org/bucket/token) for a fresh install.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=aot
      - DOCKER_INFLUXDB_INIT_PASSWORD=mmdu77sj3nIoiajjs
      - DOCKER_INFLUXDB_INIT_ORG=aot
      - DOCKER_INFLUXDB_INIT_BUCKET=aot_db
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mmdu77sj3nIoiajjs
    restart: always

volumes:
  aot_data:
  flask_session:
  aot_logs:
  aot_uploads:
  aot_model_assets:
  aot_backups:
  aot_user_scripts:
  influxdb_data:
  influxdb_config:
