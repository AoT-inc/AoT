# Production / distribution compose — runs the pre-built GHCR image instead of
# building from a host source checkout. Upgrade with:
#     docker compose -f docker/docker-compose.prod.yml pull
#     docker compose -f docker/docker-compose.prod.yml up -d
# The app auto-migrates the volume DB on startup (aot_flask/app.py). All data
# (SQLite DBs, secret key, kma, InfluxDB, uploaded files, 3D model assets,
# admin/backup snapshots, user scripts) lives in named volumes and survives
# image swaps. Roll back by pinning AOT_IMAGE_TAG to a previous version.
#
# Copy .env.prod.example to .env and set AOT_IMAGE_TAG.
name: aot

services:
  aot-app:
    image: ghcr.io/aot-inc/aot:${AOT_IMAGE_TAG:-latest}
    command: gunicorn -c /app/install/gunicorn_conf.py --bind 0.0.0.0:80 aot.start_flask_ui:app
    ports:
      - "${AOT_PORT:-8084}:80"
    volumes:
      # Live data (SQLite DBs + secret key + kma) — named volume, NOT a bind mount
      # (bind mounts break SQLite WAL/atomic-rename on macOS/Windows Docker).
      - aot_data:/app/aot_local
      - flask_session:/app/aot/databases/flask_session
      - aot_logs:/var/log/aot
      # User-uploaded files (notes/notice attachments, facility & zone photos) —
      # without this they live only in the container's writable layer and are
      # lost on every `docker compose pull && up -d` image swap.
      - aot_uploads:/app/uploads
      # Facility 3D model assets (.glb/.gltf + preview thumbnails) — same risk,
      # separate mount because it lives under the Flask static folder, not /app/uploads.
      - aot_model_assets:/app/aot/aot_flask/static/uploads/model_assets
      # admin/backup snapshots (see aot/utils/docker_backup.py) — must persist
      # independently of aot_data, since a backup exists precisely so it can
      # outlive a bad restore or a corrupted live DB.
      - aot_backups:/app/aot/tests/backups
      # User-authored scripts (Export/Import + admin/backup both cover this
      # dir, but with no volume it's still wiped on every image swap).
      - aot_user_scripts:/app/aot/user_scripts
      # User/commercial extension modules are NOT baked into the public image.
      # Mount them from the host (repo custom_* dirs); empty for stock installs.
      - ../aot/inputs/custom_inputs:/app/aot/inputs/custom_inputs
      - ../aot/outputs/custom_outputs:/app/aot/outputs/custom_outputs
      - ../aot/functions/custom_functions:/app/aot/functions/custom_functions
      - ../aot/actions/custom_actions:/app/aot/actions/custom_actions
      - ../aot/widgets/custom_widgets:/app/aot/widgets/custom_widgets
      - ../aot/user_python_code:/app/aot/user_python_code
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=${HARDWARE_PROFILE:-LOW}
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  aot_daemon:
    image: ghcr.io/aot-inc/aot:${AOT_IMAGE_TAG:-latest}
    command: python aot/aot_daemon.py
    volumes:
      # Same named volume as aot-app: daemon and UI must open the SAME aot.db.
      - aot_data:/app/aot_local
      - aot_logs:/var/log/aot
      # User/commercial extension modules (see aot-app) — the daemon runs outputs.
      - ../aot/inputs/custom_inputs:/app/aot/inputs/custom_inputs
      - ../aot/outputs/custom_outputs:/app/aot/outputs/custom_outputs
      - ../aot/functions/custom_functions:/app/aot/functions/custom_functions
      - ../aot/actions/custom_actions:/app/aot/actions/custom_actions
      - ../aot/widgets/custom_widgets:/app/aot/widgets/custom_widgets
      - ../aot/user_python_code:/app/aot/user_python_code
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=${HARDWARE_PROFILE:-LOW}
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb
    restart: always

  influxdb:
    image: influxdb:2.7
    ports:
      # localhost-only: default credentials are public, so never expose to the LAN.
      # The app containers reach it over the compose network (influxdb:8086).
      - "127.0.0.1:8087:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - TZ=${TZ:-Asia/Seoul}
      # First-boot self-initialization (org/bucket/token) for a fresh install.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=aot
      - DOCKER_INFLUXDB_INIT_PASSWORD=mmdu77sj3nIoiajjs
      - DOCKER_INFLUXDB_INIT_ORG=aot
      - DOCKER_INFLUXDB_INIT_BUCKET=aot_db
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mmdu77sj3nIoiajjs
    restart: always

volumes:
  aot_data:
  flask_session:
  aot_logs:
  aot_uploads:
  aot_model_assets:
  aot_backups:
  aot_user_scripts:
  influxdb_data:
  influxdb_config:
