volumes:
  aot:
  aot_env:
  aot_cameras:
  aot_custom_functions:
  aot_custom_actions:
  aot_custom_inputs:
  aot_custom_outputs:
  aot_custom_widgets:
  aot_custom_user_scripts:
  aot_custom_user_css:
