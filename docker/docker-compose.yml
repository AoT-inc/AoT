name: aot_local

services:
  aot-app:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn -c /app/install/gunicorn_conf.py --bind 0.0.0.0:80 aot.start_flask_ui:app
    ports:
      - "8084:80"
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      # Source package (aot/databases/*.py, models/, migrations/) stays on the bind mount.
      - ../aot/databases:/app/aot/databases
      # Data (SQLite DBs + secret key + kma) lives on a named volume on the Linux VM
      # filesystem, NOT the macOS/Windows bind mount above. The bind mount's virtiofs/9p
      # layer breaks SQLite WAL shared-memory mmap (-> SIGBUS crash loop in the daemon)
      # and atomic rename (-> corrupt session pickles -> spurious logout). AOT_LOCAL_DIR
      # redirects DATABASE_PATH (aot.db, aot_scheduler.db, flask_secret_key, kma) here.
      - aot_data:/app/aot_local
      # Flask session store also off the bind mount (atomic rename works on a real Linux fs).
      - flask_session:/app/aot/databases/flask_session
      # Matter 사이드카 데이터 볼륨(소켓 + 백업용 Fabric), 읽기 전용.
      # docker-compose.prod.yml 의 같은 마운트 주석 참고.
      - matter_data:/app/matter_data:ro
    environment:
      # Container-local time = KST so log timestamps and any naive datetime.now()
      # scheduling (env_coordinator, lorawan schedulers, KMA inputs, pump timing)
      # match the operator's wall clock. Measurement writes use datetime.utcnow()
      # explicitly, so InfluxDB data stays UTC and is unaffected by this.
      - TZ=Asia/Seoul
      - FLASK_ENV=development
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      # 이 컨테이너에는 nginx 가 없으므로 `/mcp`·`/.well-known/oauth-protected-resource` 를
      # 웹 앱이 직접 MCP 컨테이너로 넘긴다(aot/aot_flask/mcp_forward.py). 공개 주소 하나로
      # 웹과 MCP 가 같이 닿는다 — 직접 설치의 nginx 와 같은 동작.
      - AOT_MCP_UPSTREAM=http://aot_mcp:5700
      # influxdb is a sibling container in this stack — reach it by service name
      # on the compose network (8086 internal), NOT host.docker.internal:8086
      # (the host only exposes 8087, and the host-gateway route to :8086 is
      # unreachable -> "Network is unreachable" in the measurement DB client).
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          # 이 값이 3072M 인 역사적 이유: 1G 는 AoT MCP 서버가 실제로 돌기
          # 시작하자 부족했다 — 웹 앱(~700MB)에 **자기 MCP subprocess**
          # (aot_mcp_server.py 가 전체 앱을 다시 로드, 당시 추정 ~400MB)가
          # 얹혀 1G 를 넘겼고, gunicorn 워커가 OOM(exit 137)으로 죽어 "시스템
          # 오류" 가 됐다. 데몬 쪽에서 같은 양을 덜어 총 예산을 2.5G 로
          # 유지했다(~4G 도커 VM 안).
          #
          # **2026-08-22: 그 subprocess 가 없어졌다.** 도구 실행층을
          # aot/ai/services/tool_execution.py 로 분리해, 내부 AI 가 프로토콜을
          # 거치지 않고 직접 부른다(CLAUDE.md "도구 실행층은 MCP 가 아니다").
          # 앱 컨테이너 재시작 기준 실측:
          #     전 374 MiB (MCP subprocess 190 MB 상주)
          #     후 221 MiB (subprocess 없음)
          # 즉 이 한도의 원래 근거는 사라졌다. 다만 값은 그대로 둔다 — 한도는
          # 카메라 처리·동시 요청·워커 수에도 걸리므로, 줄이려면 그 부하까지
          # 실사용으로 지켜본 뒤 정할 일이다. 줄일 때 이 문단이 근거다.
          memory: 3072M
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  # 외부 MCP 서버 — 외부 AI(Claude Code/Desktop 등)가 상태 점검·제어 조언을 위해
  # 접속한다. aot-app 안에서 `docker exec -d`로 띄우면 임시 프로세스라 재빌드/
  # 재시작 때마다 죽으므로(2026-07-26 실제로 겪음) 별도 서비스로 올려 restart
  # 정책을 받는다. aot-app 과 같은 aot_data 볼륨을 마운트해야 같은 aot.db 를
  # 열고 승인 큐(mcp_confirmation)를 공유한다. 인증은 mcp_auth.py(X-API-KEY =
  # base64(User.api_key), Settings > Users 에서 발급)가 처리하지만, 그와 별개로
  # 2026-07-28: 외부 리버스프록시(NPM, aot-proxy-1) 경유 접속을 위해 이 Mac의
  # Tailscale IP(100.111.33.43)에만 바인딩 — 같은 tailnet의 NPM에서는 도달
  # 가능하지만 가정용 LAN/그 외 인터넷 인터페이스로는 여전히 안 열린다.
  # Tailscale IP가 바뀌면(재등록 등) 이 값도 같이 갱신해야 한다.
  # docker-compose.prod.yml 의 aot_mcp 서비스와 같은 구성, 여기서는
  # build-from-source 스타일로 맞춤.
  # stdio로 붙는 클라이언트는 반드시 이 컨테이너로 exec 해야 한다 —
  # `docker exec -i aot_local-aot_mcp-1 python aot/aot_mcp_server.py`.
  # AOT_MCP_API_KEY(아래)가 여기에만 있고 aot-app에는 없으므로, aot-app으로
  # exec하면 인증이 깨진다.
  aot_mcp:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python aot/aot_mcp_server.py --http --port 5700
    # 컨테이너 기본 hostname은 랜덤 컨테이너 ID(예: de4bf2a3f387)라, MCP 도구
    # 응답에 자동으로 실리는 server_host(aot_mcp_server.py SERVER_HOST)가
    # 알아볼 수 없는 값이 된다. 이 compose 파일은 여러 머신(로컬/koat-macmini
    # 등)이 git으로 그대로 공유하므로 값을 하드코딩하면 전부 같은 이름이
    # 되어 오히려 구분이 안 된다 — 머신별로 docker/.env 의 AOT_MCP_HOSTNAME
    # 으로 override, 미설정 시에만 기본값 사용.
    hostname: ${AOT_MCP_HOSTNAME:-aot-local-mcp}
    ports:
      - "100.111.33.43:5700:5700"
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      - ../aot/databases:/app/aot/databases
      - aot_data:/app/aot_local
      - flask_session:/app/aot/databases/flask_session
    environment:
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      # 쓰기 허용이지만 모든 쓰기는 사람 승인을 거친다. 0이면 조언 전용.
      - AOT_MCP_WRITE_ENABLED=${AOT_MCP_WRITE_ENABLED:-1}
      # 인바운드 인증 필수 여부. 0으로 끄면 무인증(로컬 단독 테스트용) — 감사
      # 로그에 'unauthenticated:' 접두사로 구분된다.
      - AOT_MCP_REQUIRE_AUTH=${AOT_MCP_REQUIRE_AUTH:-1}
      # stdio 클라이언트용 키(HTTP 모드에서는 미사용). 컨테이너 env 로 두면
      # `docker exec -i` 로 뜬 stdio 프로세스가 물려받는다. 값은 gitignore 된
      # docker/.env 에서 채운다.
      - AOT_MCP_API_KEY=${AOT_MCP_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # aot_mcp_server.py 는 전체 Flask 앱을 로드한다 — 2026-08-22 실측
          # 482 MiB(HTTP 상주 + stdio 연결들). 이 컨테이너는 **외부 AI 전용**
          # 이라 subprocess 분리와 무관하게 그대로 필요하다(내부 AI 는 이제
          # 앱 안의 실행층을 직접 부른다). 넉넉히 768M.
          memory: 768M
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  aot_daemon:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python aot/aot_daemon.py
    # 데몬은 SIGTERM 을 받으면 각 Output 의 Shutdown State 를 내보내고 감사
    # 기록을 flush 한 뒤 끝난다(aot_daemon.py 의 _graceful_stop). 기본 10초로는
    # 그 절차가 중간에 SIGKILL 로 잘려 장치가 어정쩡한 상태로 남는다 —
    # LoRaWAN 은 다운링크 한 건이 사이트 전역 4초 슬롯을 기다리므로 특히 길다.
    # 네이티브 설치의 aot.service 는 TimeoutSec=0(무제한)이고, 여기서는 무제한을
    # 줄 수 없어 넉넉한 상한으로 맞춘다.
    stop_grace_period: 180s
    # Docker VM 전체가 고갈되면 커널은 컨테이너 한도와 무관하게 가장 큰 프로세스를
    # 고르고, 단일 프로세스로는 대개 데몬이 가장 크다. SIGKILL 은 위 절차를 건너뛰고
    # 제어도 끊으므로 데몬을 희생 순서 뒤로 민다. 메모리 사용량은 바뀌지 않는다.
    oom_score_adj: -500
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      - ../aot/databases:/app/aot/databases
      # Same named volume as aot-app: the daemon and UI must open the SAME aot.db.
      - aot_data:/app/aot_local
      - matter_data:/app/matter_data:ro
    environment:
      # See aot-app: KST container time for readable logs + local-time scheduling.
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      # Same influxdb sidecar as aot-app (see that service for rationale).
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Reduced 1024M -> 768M to fund the aot-app increase net-zero (daemon runs
          # at ~490MB and does NOT start an MCP subprocess — it no longer warms MCP).
          # 2026-08-22: 이제 **앱도** MCP subprocess 를 띄우지 않는다 — 데몬만의
          # 특성이던 것이 양쪽 공통이 됐다(위 aot-app 주석 참조).
          memory: 1536M
    depends_on:
      - influxdb
    restart: always

  # 디지털트윈 (실험 · '준비 중' 기능) — 기본 꺼짐. 켜는 법: .env 에 COMPOSE_PROFILES=twin 후 up -d,
  # 그다음 설정 > 일반 > 디지털트윈 (실험) 토글. 별도 서비스라 죽거나 메모리가 불어도 데몬·웹과 무관하다.
  # - 이 기기의 DB·Influx 를 직접 읽고 결과를 env_twin* 측정으로 쓴다(내장 통로). 수신 API·원격 REST 는 쓰지 않는다.
  # - 토글이 꺼져 있으면 떠 있어도 일하지 않고 플래그만 가끔 본다. 낮은 사양 기기는 시작할 때 잠금을 판정해
  #   일하지 않는다(설정 화면과 같은 판정 — 이중 잠금). 그런 기기에서는 이 profile 을 켜지 말 것.
  # - 켤 대지·출처(비·센서·예보 입력)는 지도 모달의 '트윈' 탭(대지·구획 트윈 설정, DB)에서 고른다.
  # - 다른 서버를 읽는 개발용 원격 방식(NAS 등)은 docker-compose.twin-nas.yml.
  # 설계: docs/design/digital-twin-node.md
  aot_twin:
    image: aot_ai
    profiles: ["twin"]
    command: python -m aot.twin
    volumes:
      - ../:/app
      - aot_data:/app/aot_local
    environment:
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      # 앱과 같은 값이어야 잠금 판정이 설정 화면과 같다(이중 잠금)
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      # 스케줄러를 띄우지 않는다 — aot-app/daemon 과 잡 저장소가 충돌한다(aot_mcp 와 같다).
      - AOT_SKIP_SCHEDULER=1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    depends_on:
      - influxdb
    restart: unless-stopped

  # Matter 컨트롤러 사이드카 — 실험 기능, 기본 꺼짐(COMPOSE_PROFILES=matter).
  # 설정의 이유는 docker-compose.prod.yml 의 같은 서비스 주석 참고. 주의: macOS·
  # Windows Docker Desktop 의 host 네트워크는 VM 안이라 LAN mDNS 가 닿지 않는다 —
  # 여기서는 소켓 연결·재연결까지만 확인할 수 있고 실제 장치 커미셔닝은 Linux
  # 호스트에서 한다.
  matter_server:
    image: ghcr.io/matter-js/matterjs-server:${MATTER_SERVER_TAG:-1.4.0}
    profiles: ["matter"]
    network_mode: host
    volumes:
      - matter_data:/data
    environment:
      - TZ=Asia/Seoul
      - STORAGE_PATH=/data
      # 호스트 루프백 전용(host network). LAN 에서는 닿지 않는다. AoT 쪽은
      # 아래 matter_socket 이 만드는 unix socket 으로 들어온다.
      - LISTEN_ADDRESS=127.0.0.1
      - PORT=5580
      - DISABLE_DASHBOARD=true
      # 10진수로 적는다 — 서버는 이 값을 parseInt(값, 10) 으로 읽어 "0xFFF1" 이
      # 0 이 된다(실측: 다른 앱에 AoT 가 "[Matter Standard]" 로 보였다).
      # 65521 = 0xFFF1(테스트 VID). 첫 기동 전에 정한다.
      - VENDOR_ID=65521
      - FABRIC_ID=1
      # 개발용 장치(VID 0xFFF1, matter.js 예제 등)의 테스트 인증서를 받을지.
      # 실제 설치에서는 끈다.
      - ENABLE_TEST_NET_DCL=${MATTER_TEST_DCL:-false}
      # 주의: debug 로 올리면 서버가 WS 요청을 가리지 않고 그대로 로그에 남긴다 —
      # BLE 커미셔닝에 보내는 Wi-Fi 비밀번호도 평문으로 찍힌다. 진단 후 반드시
      # info 로 되돌릴 것(docker/.env 에 debug 를 남겨두지 말 것).
      - LOG_LEVEL=${MATTER_LOG_LEVEL:-info}
    restart: always

  # matter_server 의 루프백 포트를 /data/matter-server.sock 으로 중계한다.
  # matterjs-server 1.4.0 은 unix socket 을 못 연다(지원은 upstream #1111,
  # 2026-10-05 머지 — 1.4.1 정식판부터). AoT 컨테이너는 bridge 네트워크라 호스트
  # 루프백에 닿지 못하므로, 같은 볼륨 안의 소켓으로 들어오게 한다. 1.4.1 이
  # 나오면 이 서비스를 지우고 matter_server 의 LISTEN_ADDRESS 를
  # /data/matter-server.sock 으로 바꾸면 끝이다 — AoT 쪽 경로는 그대로다.
  # root 로 돌며 소켓을 0660 root:root 로 만든다(AoT 컨테이너는 root).
  matter_socket:
    image: alpine/socat:1.8.1.1
    profiles: ["matter"]
    network_mode: host
    volumes:
      - matter_data:/data
    command:
      - UNIX-LISTEN:/data/matter-server.sock,fork,unlink-early,mode=0660
      - TCP:127.0.0.1:5580
    depends_on:
      - matter_server
    restart: always

  influxdb:
    image: influxdb:2.7
    ports:
      # localhost 전용 바인딩: 기본 비밀번호가 공개돼 있으므로 LAN 노출 금지.
      # 앱 컨테이너는 docker 내부 네트워크(influxdb:8086)로 접속하므로 영향 없음.
      - "127.0.0.1:8087:8086"
    volumes:
      - ../influxdb_data:/var/lib/influxdb2
      # Named volume, NOT a bind mount to aot/influxdb_config: that dir's tracked
      # influx-configs template already has a "default" CLI config entry, which makes
      # the influxdb image's setup entrypoint fail with "config name already exists"
      # on first boot and crash-loop (wipes bolt/engine, retries, fails again forever).
      # The container recreates equivalent content itself from the INIT_* env vars below.
      - influxdb_config:/etc/influxdb2
    environment:
      # Log timestamps in KST. InfluxDB stores/queries points in UTC internally
      # regardless of TZ, so measurement data is unaffected.
      - TZ=Asia/Seoul
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=aot
      - DOCKER_INFLUXDB_INIT_PASSWORD=mmdu77sj3nIoiajjs
      - DOCKER_INFLUXDB_INIT_ORG=aot
      - DOCKER_INFLUXDB_INIT_BUCKET=aot_db
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mmdu77sj3nIoiajjs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    restart: always

volumes:
  # SQLite databases + secret key + kma on the Linux VM filesystem (see service comments).
  aot_data:
  # Flask session store on the Linux VM filesystem — avoids bind-mount corruption
  # (non-atomic rename) on Windows/macOS Docker (see aot-app volumes comment).
  flask_session:
  # InfluxDB's own CLI config store — kept off the tracked aot/influxdb_config
  # template (see influxdb service volumes comment).
  influxdb_config:
  # Matter 사이드카 Fabric 저장소 + API 소켓 (matter_server 서비스 주석 참고).
  matter_data:
