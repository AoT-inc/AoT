name: aot_local

services:
  aot-app:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn -c /app/install/gunicorn_conf.py --bind 0.0.0.0:80 aot.start_flask_ui:app
    ports:
      - "8084:80"
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      # Source package (aot/databases/*.py, models/, migrations/) stays on the bind mount.
      - ../aot/databases:/app/aot/databases
      # Data (SQLite DBs + secret key + kma) lives on a named volume on the Linux VM
      # filesystem, NOT the macOS/Windows bind mount above. The bind mount's virtiofs/9p
      # layer breaks SQLite WAL shared-memory mmap (-> SIGBUS crash loop in the daemon)
      # and atomic rename (-> corrupt session pickles -> spurious logout). AOT_LOCAL_DIR
      # redirects DATABASE_PATH (aot.db, aot_scheduler.db, flask_secret_key, kma) here.
      - aot_data:/app/aot_local
      # Flask session store also off the bind mount (atomic rename works on a real Linux fs).
      - flask_session:/app/aot/databases/flask_session
    environment:
      # Container-local time = KST so log timestamps and any naive datetime.now()
      # scheduling (env_coordinator, lorawan schedulers, KMA inputs, pump timing)
      # match the operator's wall clock. Measurement writes use datetime.utcnow()
      # explicitly, so InfluxDB data stays UTC and is unaffected by this.
      - TZ=Asia/Seoul
      - FLASK_ENV=development
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      # influxdb is a sibling container in this stack — reach it by service name
      # on the compose network (8086 internal), NOT host.docker.internal:8086
      # (the host only exposes 8087, and the host-gateway route to :8086 is
      # unreachable -> "Network is unreachable" in the measurement DB client).
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          # 1G was too tight once the AoT MCP server actually runs: the web app
          # (~700MB) plus its MCP subprocess (aot_mcp_server.py loads the full app,
          # ~400MB) exceeded 1G → gunicorn worker OOM-killed (exit 137) → "시스템
          # 오류". Rebalanced net-zero against the daemon (below) so total container
          # budget stays 2.5G within the ~4G Docker VM (no host-pressure regression).
          memory: 3072M
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  # 외부 MCP 서버 — 외부 AI(Claude Code/Desktop 등)가 상태 점검·제어 조언을 위해
  # 접속한다. aot-app 안에서 `docker exec -d`로 띄우면 임시 프로세스라 재빌드/
  # 재시작 때마다 죽으므로(2026-07-26 실제로 겪음) 별도 서비스로 올려 restart
  # 정책을 받는다. aot-app 과 같은 aot_data 볼륨을 마운트해야 같은 aot.db 를
  # 열고 승인 큐(mcp_confirmation)를 공유한다. 인증은 mcp_auth.py(X-API-KEY =
  # base64(User.api_key), Settings > Users 에서 발급)가 처리하지만, 그와 별개로
  # 2026-07-28: 외부 리버스프록시(NPM, aot-proxy-1) 경유 접속을 위해 이 Mac의
  # Tailscale IP(100.111.33.43)에만 바인딩 — 같은 tailnet의 NPM에서는 도달
  # 가능하지만 가정용 LAN/그 외 인터넷 인터페이스로는 여전히 안 열린다.
  # Tailscale IP가 바뀌면(재등록 등) 이 값도 같이 갱신해야 한다.
  # docker-compose.prod.yml 의 aot_mcp 서비스와 같은 구성, 여기서는
  # build-from-source 스타일로 맞춤.
  # stdio로 붙는 클라이언트는 반드시 이 컨테이너로 exec 해야 한다 —
  # `docker exec -i aot_local-aot_mcp-1 python aot/aot_mcp_server.py`.
  # AOT_MCP_API_KEY(아래)가 여기에만 있고 aot-app에는 없으므로, aot-app으로
  # exec하면 인증이 깨진다.
  aot_mcp:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python aot/aot_mcp_server.py --http --port 5700
    # 컨테이너 기본 hostname은 랜덤 컨테이너 ID(예: de4bf2a3f387)라, MCP 도구
    # 응답에 자동으로 실리는 server_host(aot_mcp_server.py SERVER_HOST)가
    # 알아볼 수 없는 값이 된다. 이 compose 파일은 여러 머신(로컬/koat-macmini
    # 등)이 git으로 그대로 공유하므로 값을 하드코딩하면 전부 같은 이름이
    # 되어 오히려 구분이 안 된다 — 머신별로 docker/.env 의 AOT_MCP_HOSTNAME
    # 으로 override, 미설정 시에만 기본값 사용.
    hostname: ${AOT_MCP_HOSTNAME:-aot-local-mcp}
    ports:
      - "100.111.33.43:5700:5700"
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      - ../aot/databases:/app/aot/databases
      - aot_data:/app/aot_local
      - flask_session:/app/aot/databases/flask_session
    environment:
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      # 쓰기 허용이지만 모든 쓰기는 사람 승인을 거친다. 0이면 조언 전용.
      - AOT_MCP_WRITE_ENABLED=${AOT_MCP_WRITE_ENABLED:-1}
      # 인바운드 인증 필수 여부. 0으로 끄면 무인증(로컬 단독 테스트용) — 감사
      # 로그에 'unauthenticated:' 접두사로 구분된다.
      - AOT_MCP_REQUIRE_AUTH=${AOT_MCP_REQUIRE_AUTH:-1}
      # stdio 클라이언트용 키(HTTP 모드에서는 미사용). 컨테이너 env 로 두면
      # `docker exec -i` 로 뜬 stdio 프로세스가 물려받는다. 값은 gitignore 된
      # docker/.env 에서 채운다.
      - AOT_MCP_API_KEY=${AOT_MCP_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # aot_mcp_server.py 도 전체 Flask 앱을 로드하므로 ~400MB 안팎 (aot-app
          # 메모리 주석 참고). 넉넉히 768M.
          memory: 768M
    depends_on:
      - aot_daemon
      - influxdb
    restart: always

  aot_daemon:
    image: aot_ai
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python aot/aot_daemon.py
    volumes:
      - ../:/app
      - ../logs:/var/log/aot
      - ../aot/databases:/app/aot/databases
      # Same named volume as aot-app: the daemon and UI must open the SAME aot.db.
      - aot_data:/app/aot_local
    environment:
      # See aot-app: KST container time for readable logs + local-time scheduling.
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DOCKER_CONTAINER=TRUE
      - HARDWARE_PROFILE=LOW
      - AOT_LOCAL_DIR=/app/aot_local
      # Same influxdb sidecar as aot-app (see that service for rationale).
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Reduced 1024M -> 768M to fund the aot-app increase net-zero (daemon runs
          # at ~490MB and does NOT start an MCP subprocess — it no longer warms MCP).
          memory: 1536M
    depends_on:
      - influxdb
    restart: always

  influxdb:
    image: influxdb:2.7
    ports:
      # localhost 전용 바인딩: 기본 비밀번호가 공개돼 있으므로 LAN 노출 금지.
      # 앱 컨테이너는 docker 내부 네트워크(influxdb:8086)로 접속하므로 영향 없음.
      - "127.0.0.1:8087:8086"
    volumes:
      - ../influxdb_data:/var/lib/influxdb2
      # Named volume, NOT a bind mount to aot/influxdb_config: that dir's tracked
      # influx-configs template already has a "default" CLI config entry, which makes
      # the influxdb image's setup entrypoint fail with "config name already exists"
      # on first boot and crash-loop (wipes bolt/engine, retries, fails again forever).
      # The container recreates equivalent content itself from the INIT_* env vars below.
      - influxdb_config:/etc/influxdb2
    environment:
      # Log timestamps in KST. InfluxDB stores/queries points in UTC internally
      # regardless of TZ, so measurement data is unaffected.
      - TZ=Asia/Seoul
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=aot
      - DOCKER_INFLUXDB_INIT_PASSWORD=mmdu77sj3nIoiajjs
      - DOCKER_INFLUXDB_INIT_ORG=aot
      - DOCKER_INFLUXDB_INIT_BUCKET=aot_db
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mmdu77sj3nIoiajjs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    restart: always

volumes:
  # SQLite databases + secret key + kma on the Linux VM filesystem (see service comments).
  aot_data:
  # Flask session store on the Linux VM filesystem — avoids bind-mount corruption
  # (non-atomic rename) on Windows/macOS Docker (see aot-app volumes comment).
  flask_session:
  # InfluxDB's own CLI config store — kept off the tracked aot/influxdb_config
  # template (see influxdb service volumes comment).
  influxdb_config:

