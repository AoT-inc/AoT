site_name: AoT
site_url: https://aot-inc.github.io/AoT
site_author: AoT Inc.
site_description: AoT Documentation
repo_name: 'aot-inc/AoT'
repo_url: 'https://github.com/AoT-inc/AoT'

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
        - locale: ja
          name: 日本語
          build: true
  - minify:
      minify_html: true

extra_css:
  - css/aot-manual.css

# 매뉴얼이 아닌 내부 문서/개발 노트는 빌드에서 제외
exclude_docs: |
  architecture/
  dev/
  upgrade/
  design/
  ai_docs/
  *_Analysis.md
  PLAN-*.md
  TASK_*.md
  directive_*.md
  *_design.md
  design_*.md
  i18n_translation_guide.md
  env_coordinator_user_guide.md
  ai_guide.md
  ai_guide.*.md
  GEO.md
  General-Settings.md
  Supported-Geo-Layers.md
  map.md

theme:
  name: material
  language: en
  logo: images/aot-logo-white.svg
  favicon: images/favicon.png
  features:
    - navigation.tabs
    - navigation.top
  palette:
    - scheme: preference
      primary: blue
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  font:
    text: Barlow
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - toc:
     permalink: "~"
     toc_depth: 4
  - pymdownx.mark
  - pymdownx.tabbed
  - pymdownx.emoji:
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - meta

nav:
  - Home: index.md
  - About: About.md
  - Usage:
    - Data Viewing: Data-Viewing.md
    - Inputs.md
    - Outputs.md
    - Functions.md
    - Actions.md
    - Calibration.md
    - Methods.md
    - Alerts.md
    - Notes.md
    - Notice Board: Notices.md
    - Camera.md
    - Energy Usage: Energy-Usage.md
    - Python-Code.md
    - AI & Automation:
      - AI Overview: ai/overview.md
      - Environmental Control: ai/env-control.md
    - GIS & Map:
      - Overview: geo/overview.md
      - Getting Started: geo/getting-started.md
      - Design Tool: geo/design-tool.md
      - Facility Management: geo/facility.md
      - GIS Layers: geo/layers.md
      - Map Widget: geo/map-widget.md
      - Facility Widget: geo/facility-widget.md
      - Parcel Import: geo/parcel-import.md
      - Settings: geo/settings.md
      - API Reference: geo/api-reference.md
  - Supported Devices:
    - Inputs Sorted by Measurement: Supported-Inputs-By-Measurement.md
    - Supported Inputs: Supported-Inputs.md
    - Supported Outputs: Supported-Outputs.md
    - Supported Functions: Supported-Functions.md
    - Supported Actions: Supported-Actions.md
    - Supported Widgets: Supported-Widgets.md
    - I2C Multiplexers: I2C-Multiplexers.md
    - Analog-To-Digital Converters: Analog-To-Digital-Converters.md
    - Interfaces.md
    - Dependencies.md
    - Device Notes: Device-Notes.md
  - System:
    - System Information: System-Information.md
    - System Configuration: Configuration-Settings.md
    - Time & Timezones: time-handling.md
    - Upgrade/Backup/Restore: Upgrade-Backup-Restore.md
    - Export/Import: Export-Import.md
    - Error Codes: Error-Codes.md
    - AoT Client: AoT-Client.md
    - API.md
  - Troubleshooting.md

extra:
  version: 26.07.3
