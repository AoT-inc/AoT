site_name: AoT
site_url: https://aot-inc.github.io/AoT
site_author: AoT Inc.
site_description: AoT Documentation
repo_name: 'aot-inc/AoT'
repo_url: 'https://github.com/aot-inc/AoT'

plugins:
  - search:
  - i18n:
      default_language: 'ko'
#      add_lang_links: False  # option staged to be merged for mkdocs-i18n, hides language links at top of all pages
      languages:
        ko: "한국어"
        en: "English"
        ja: "日本語"
      no_translation:
        ko: "이 페이지는 한국어로 번역되지 않았습니다."
        en: "This page isn't translated to English."
        ja: "このページは日本語に翻訳されていません。"
      translate_nav:
        en:
          Usage: "Usage"
          Supported Devices: "Supported Devices"
          Supported Devices: "Dispositivos Soportados"

  - minify:
      minify_html: true

extra_css:
  - css/hide_lang_links.css

theme:
  name: material
  language: ko
  logo: images/favicon.png
  favicon: images/favicon.png
  features:
    - navigation.tabs
    - navigation.top
  palette:
    - scheme: preference
      primary: blue
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  font:
    text: Barlow
    code: Roboto Mono

markdown_extensions:
  - admonition
  - toc:
     permalink: "~"
     toc_depth: 4
  - pymdownx.mark
  - pymdownx.tabbed
  - pymdownx.emoji:
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - meta

